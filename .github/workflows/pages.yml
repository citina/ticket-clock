name: deploy page

# Publishes docs/ to GitHub Pages on pushes that change it. weekly.yml starts it
# by hand after its weekly run: pushes made with GITHUB_TOKEN don't trigger on: push.
# LA Street Rules' data isn't in the repo; it comes from the city-data release.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the LA Street Rules data from the city-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download city-data --pattern streets-data.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/streets-data.tar.gz" -C docs/streets
          else
            echo "::warning::no city-data release yet; LA Street Rules will say its data didn't load"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
