name: weekly update

# LADOT refreshes the citation feed (data.lacity.org 4f5p-udkv) daily; the pages are
# rebuilt once a week. GitHub's cron is best-effort, which is fine here: a late run
# only publishes a few hours later.
#
# Two jobs run side by side: `update` commits the USC page's data, and `city` rebuilds
# LA Street Rules' city-wide data (~16 MB) and publishes it as the city-data release
# instead of committing it, so the repo doesn't grow every week. `deploy` then starts
# pages.yml, which puts that release into docs/streets/data/.
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC (7:17 am PDT, 6:17 am PST)
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: write           # push the USC data, publish the city-data release
  actions: write            # to start the Pages deploy

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash         # -eo pipefail, so a failing analyze.py isn't hidden by tee
    steps:
      - uses: actions/checkout@v4

      # The versions the analysis was written and checked with
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pandas==1.3.4 numpy==1.26.4 scipy==1.12.0

      - name: Fetch citations
        run: python3 fetch_citations.py

      - name: Analyze and build
        run: |
          python3 analyze.py | tee analyze.log
          sed -n 's/^warning: /::warning::/p' analyze.log
          python3 build.py

      # A short or broken download shouldn't replace the page with a thinner one.
      - name: Check the ticket count
        run: |
          old=$(git show HEAD:data/bundle.json | python3 -c "import json, sys; print(json.load(sys.stdin)['total'])")
          new=$(python3 -c "import json; print(json.load(open('data/bundle.json'))['total'])")
          echo "tickets: $old -> $new"
          if [ "$new" -lt $((old * 99 / 100)) ]; then
            echo "::error::ticket count fell from $old to $new; not publishing"; exit 1
          fi

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "ticket-clock bot"
          git config user.email "noreply@github.com"
          git add data/bundle.json docs/index.html
          if git diff --cached --quiet; then
            echo "nothing new"; exit 0
          fi
          end=$(python3 -c "import json; print(json.load(open('data/bundle.json'))['end'])")
          git commit -m "data: tickets through $end"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  city:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pandas==1.3.4 numpy==1.26.4 scipy==1.12.0

      - name: Fetch city-wide tickets, street centerlines and meters
        run: python3 fetch_city.py

      # analyze_city.py itself stops if a month in the window came back thin
      - name: Analyze
        run: python3 analyze_city.py

      # The window rolls, so the count moves a little every week; a big drop means a broken download.
      - name: Check the ticket count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(python3 -c "import json; print(json.load(open('docs/streets/data/index.json'))['total'])")
          old=$(gh release view city-data --json body --jq .body 2>/dev/null | sed -n 's/^tickets: //p')
          echo "tickets in the window: ${old:-none yet} -> $new"
          if [ -n "$old" ] && [ "$new" -lt $((old * 90 / 100)) ]; then
            echo "::error::ticket count fell from $old to $new; not publishing"; exit 1
          fi

      - name: Publish as the city-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf streets-data.tar.gz -C docs/streets data
          read -r end total <<<"$(python3 -c "import json; m = json.load(open('docs/streets/data/index.json')); print(m['end'], m['total'])")"
          notes=$(printf 'Data for LA Street Rules (docs/streets/), rebuilt every week by weekly.yml. Tickets through %s.\n\ntickets: %s\n' "$end" "$total")
          if gh release view city-data >/dev/null 2>&1; then
            gh release upload city-data streets-data.tar.gz --clobber
            gh release edit city-data --notes "$notes"
          else
            gh release create city-data streets-data.tar.gz --title "LA Street Rules data" --notes "$notes" --latest=false
          fi

  # A push made with GITHUB_TOKEN doesn't trigger pages.yml, so start it here. It runs even if one
  # job failed, so the other page still updates (a failed city job leaves last week's release in place).
  deploy:
    needs: [update, city]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Start the Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
